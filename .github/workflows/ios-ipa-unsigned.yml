name: Build iOS IPA (Unsigned)
run-name: "Unsigned IPA • ${{ inputs.source_repo }} @ ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or commit SHA)
        required: false
        default: dev
      source_repo:
        description: Source repository (owner/name)
        required: false
        default: amnezia-vpn/amnezia-client

permissions:
  contents: write

env:
  QT_VERSION: 6.10.1
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  DEV_AGW_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwMJbYlGxn3l+0XiGA9I/\nBHK8HX/aet7A9GVL817apDUeL6sdISRBdopv5Y0FdrBHSJWSUdWtVxVazJB46J8x\n327/5H5pi0nkfRbcgxBGSGxhKOvwRe+WPVb2f81jlkenZK46c9C7dNmX/310rlHY\nBwOnZcdw2oKu6hTNDwk3nyUo2v2/leNIMLsv84RlHAX6Tyx5slq8ysewhcmdfv17\nWQjF7albq12ZafTSjtXqDcsrk2oF8mfyzxLjSXbxQHKIDHkfz3SUXCs/H9tt1ydK\n2Yj6nIxv98HESZ8Ng40OZPhHDex8Ru1NjcWlo2EWNM1xT8IqmBT21PLuyzGjNSwG\nOjnm1V2EcjerVmRNhFTJG70RkURD/i2MDbG+ZKpqPtW1uL8wEt2IkSqNfKcf+TF+\nUJZZfm1lDUMpWJ2eWJGrgOUX8/f8v/GB+x4PxUo1m7V/pDLqCUPm3l2dkaM9P0sM\n6lO0+jKqfIFnG1zjc3if7r1YbDsZlyl389q9Hrh7t+Lwj/JXkDxFaTnudM8egaXk\nGX5YxZiEDmCCLRskRwBBUaYffXIpFbI8sO2Xj0J5/im5xtu7TtfJktcPzDL9uyG1\nEbt8oSA4FTzTid6Zwj55YgDfz0FMnNmXh80T1xMzlbi6y+BCuna+I+7McMRo8yz3\nVzzYJ0/J7PpHpXoZv7K1qDsCAwEAAQ==\n-----END PUBLIC KEY-----"
  DEV_AGW_ENDPOINT: "http://gw.dev.amzsvc.com:80/"
  DEV_S3_ENDPOINT: "https://s3.eu-north-1.amazonaws.com/amnezia-dev/endpoints.json"
  PROD_AGW_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAj5mxl/4DL3Sk89ntxs5G\nX3JawGQWIoq6rvNkOzNGuNgedNS2+pi6hZl3Izl1Io9om4KiUlMT6mgLO1hTr9q+\ns7CYhlvroFA7ErucF+9L+7FCt0Igi0kIK/R2/vxd/2HaUrorn/aSvvutkYwbfxqW\nSwtzE+RuBeDWGvEt937OW0oqYONPYv9E4T56Dz/EZ6v2t8ejAnKLbGD/GocMmipK\n7etFSiSMAB2RmaztqTq4NleBepfO80XpYlW9pCSXuHcE8wxHczkzxsbyMAMsG/K3\nvUQY6qPtohqqzSSBwa/8u2ptNHBeor7l7DdYXeR/Nqcc4z92VUkZ5lOVR4evkS5V\n/wQqp5tnOJEj3NjUhEhXFoNEapbZd1bh6iQoUk7jC1TdvKJ/nPKGZAsHRpr0rNKz\nfx/N/Oo6lr2yh/+ps6VxTkbPmB6E85WOO3UvjImZUY0XQdBjWle/4iJLdEC77Nr0\njXhdgeypucy6jkB6iBHMeVMlrNMEV7UxoBR/cCNx55zu/8sml5ByiDvCDT7sRomN\nNgVt5S/FaVjYuzFUifJ12ToChXFgESKFmuso7WluEaWvMIGREdrMrKQKHfYLOzWF\n2B5ZJDqw4o03fU4J/6rw61M1b+rjVpXMjPnzc2A+RgcjTvXv955gfZkwe4lt5wk/\n3j8zMVo3+zLrMTAaEeIUM0UCAwEAAQ==\n-----END PUBLIC KEY-----"
  PROD_S3_ENDPOINT: "https://s3.eu-north-1.amazonaws.com/amnezia/endpoints.json, https://storage.googleapis.com/lambda-list/endpoints.json"
  FREE_V2_ENDPOINT: "https://free.invalid/"
  PREM_V1_ENDPOINT: "https://prem.invalid/"
jobs:
  build-ipa-unsigned:
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia qtimageformats
          dir: ${{ runner.temp }}
          setup-python: true
          set-env: true
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --base ${{ env.QT_MIRROR }}

      - name: Install iOS Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia qtimageformats
          dir: ${{ runner.temp }}
          setup-python: true
          set-env: true
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --external 7z --base ${{ env.QT_MIRROR }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup gomobile
        run: |
          export PATH=$PATH:$HOME/go/bin
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Install Python deps
        run: pip install jsonschema jinja2

      - name: Derive version from ref
        id: version
        run: |
          REF_RAW="${{ inputs.ref }}"
          REF_CLEAN="${REF_RAW#v}"
          if echo "$REF_CLEAN" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            SHORT_VER=$(echo "$REF_CLEAN" | awk -F. '{print $1"."$2"."$3}')
            BUILD_NUM=$(echo "$REF_CLEAN" | awk -F. '{print ($4==""?"1":$4)}')
            echo "version_args=MARKETING_VERSION=${SHORT_VER} CURRENT_PROJECT_VERSION=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
            echo "short_ver=${SHORT_VER}" >> "$GITHUB_OUTPUT"
            echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          else
            echo "version_args=" >> "$GITHUB_OUTPUT"
            echo "short_ver=" >> "$GITHUB_OUTPUT"
            echo "build_num=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Xcode project
        run: |
          export QT_BIN_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/ios/bin"
          export QT_MACOS_ROOT_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/macos"
          export PATH=$PATH:$HOME/go/bin
          "$QT_BIN_DIR/qt-cmake" . -B build-ios -GXcode -DQT_HOST_PATH="$QT_MACOS_ROOT_DIR"

      - name: Build iOS app without signing
        run: |
          export PATH=$PATH:$HOME/go/bin
          VERSION_ARGS="${{ steps.version.outputs.version_args }}"
          export DEV_AGW_PUBLIC_KEY='-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwMJbYlGxn3l+0XiGA9I/\nBHK8HX/aet7A9GVL817apDUeL6sdISRBdopv5Y0FdrBHSJWSUdWtVxVazJB46J8x\n327/5H5pi0nkfRbcgxBGSGxhKOvwRe+WPVb2f81jlkenZK46c9C7dNmX/310rlHY\nBwOnZcdw2oKu6hTNDwk3nyUo2v2/leNIMLsv84RlHAX6Tyx5slq8ysewhcmdfv17\nWQjF7albq12ZafTSjtXqDcsrk2oF8mfyzxLjSXbxQHKIDHkfz3SUXCs/H9tt1ydK\n2Yj6nIxv98HESZ8Ng40OZPhHDex8Ru1NjcWlo2EWNM1xT8IqmBT21PLuyzGjNSwG\nOjnm1V2EcjerVmRNhFTJG70RkURD/i2MDbG+ZKpqPtW1uL8wEt2IkSqNfKcf+TF+\nUJZZfm1lDUMpWJ2eWJGrgOUX8/f8v/GB+x4PxUo1m7V/pDLqCUPm3l2dkaM9P0sM\n6lO0+jKqfIFnG1zjc3if7r1YbDsZlyl389q9Hrh7t+Lwj/JXkDxFaTnudM8egaXk\nGX5YxZiEDmCCLRskRwBBUaYffXIpFbI8sO2Xj0J5/im5xtu7TtfJktcPzDL9uyG1\nEbt8oSA4FTzTid6Zwj55YgDfz0FMnNmXh80T1xMzlbi6y+BCuna+I+7McMRo8yz3\nVzzYJ0/J7PpHpXoZv7K1qDsCAwEAAQ==\n-----END PUBLIC KEY-----'
          export DEV_AGW_ENDPOINT='http://gw.dev.amzsvc.com:80/'
          export DEV_S3_ENDPOINT='https://s3.eu-north-1.amazonaws.com/amnezia-dev/endpoints.json'
          export PROD_AGW_PUBLIC_KEY='-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAj5mxl/4DL3Sk89ntxs5G\nX3JawGQWIoq6rvNkOzNGuNgedNS2+pi6hZl3Izl1Io9om4KiUlMT6mgLO1hTr9q+\ns7CYhlvroFA7ErucF+9L+7FCt0Igi0kIK/R2/vxd/2HaUrorn/aSvvutkYwbfxqW\nSwtzE+RuBeDWGvEt937OW0oqYONPYv9E4T56Dz/EZ6v2t8ejAnKLbGD/GocMmipK\n7etFSiSMAB2RmaztqTq4NleBepfO80XpYlW9pCSXuHcE8wxHczkzxsbyMAMsG/K3\nvUQY6qPtohqqzSSBwa/8u2ptNHBeor7l7DdYXeR/Nqcc4z92VUkZ5lOVR4evkS5V\n/wQqp5tnOJEj3NjUhEhXFoNEapbZd1bh6iQoUk7jC1TdvKJ/nPKGZAsHRpr0rNKz\nfx/N/Oo6lr2yh/+ps6VxTkbPmB6E85WOO3UvjImZUY0XQdBjWle/4iJLdEC77Nr0\njXhdgeypucy6jkB6iBHMeVMlrNMEV7UxoBR/cCNx55zu/8sml5ByiDvCDT7sRomN\nNgVt5S/FaVjYuzFUifJ12ToChXFgESKFmuso7WluEaWvMIGREdrMrKQKHfYLOzWF\n2B5ZJDqw4o03fU4J/6rw61M1b+rjVpXMjPnzc2A+RgcjTvXv955gfZkwe4lt5wk/\n3j8zMVo3+zLrMTAaEeIUM0UCAwEAAQ==\n-----END PUBLIC KEY-----'
          export PROD_S3_ENDPOINT='https://s3.eu-north-1.amazonaws.com/amnezia/endpoints.json, https://storage.googleapis.com/lambda-list/endpoints.json'
          export FREE_V2_ENDPOINT='https://free.invalid/'
          export PREM_V1_ENDPOINT='https://prem.invalid/'
          xcodebuild \
            -project build-ios/AmneziaVPN.xcodeproj \
            -scheme AmneziaVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO \
            PATH="$PATH" \
            $VERSION_ARGS \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build-ios" -type d -name AmneziaVPN.app -path '*Release-iphoneos*' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Release app bundle not found"
            find "$GITHUB_WORKSPACE/build-ios" -type d -name '*.app' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa" Payload
          ls -lah "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-iOS-unsigned-ipa
          path: AmneziaVPN-iOS-unsigned.ipa
          retention-days: 7

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_REF="${{ inputs.ref }}"
          SAFE_REF=$(echo "$RAW_REF" | tr '/:@ ' '----')
          REL_TAG="unsigned-${SAFE_REF}"
          REL_TITLE="Amnezia unsigned IPA (${RAW_REF})"
          REL_NOTES="Source repo: ${{ inputs.source_repo }}; Source ref: ${RAW_REF}; Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if gh release view "$REL_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa" -R "${{ github.repository }}" --clobber
          else
            gh release create "$REL_TAG" "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa" -R "${{ github.repository }}" --title "$REL_TITLE" --notes "$REL_NOTES"
          fi
