name: Build iOS IPA (Unsigned)
run-name: "Unsigned IPA • ${{ inputs.source_repo }} @ ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or commit SHA)
        required: false
        default: dev
      source_repo:
        description: Source repository (owner/name)
        required: false
        default: amnezia-vpn/amnezia-client

permissions:
  contents: write

env:
  QT_VERSION: 6.10.1
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  build-ipa-unsigned:
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia qtimageformats
          dir: ${{ runner.temp }}
          setup-python: true
          set-env: true
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --base ${{ env.QT_MIRROR }}

      - name: Install iOS Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia qtimageformats
          dir: ${{ runner.temp }}
          setup-python: true
          set-env: true
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --external 7z --base ${{ env.QT_MIRROR }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup gomobile
        run: |
          export PATH=$PATH:$HOME/go/bin
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Install Python deps
        run: pip install jsonschema jinja2

      - name: Generate Xcode project
        run: |
          export QT_BIN_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/ios/bin"
          export QT_MACOS_ROOT_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/macos"
          export PATH=$PATH:$HOME/go/bin
          "$QT_BIN_DIR/qt-cmake" . -B build-ios -GXcode -DQT_HOST_PATH="$QT_MACOS_ROOT_DIR"

      - name: Build iOS app without signing
        run: |
          export PATH=$PATH:$HOME/go/bin
          xcodebuild \
            -project build-ios/AmneziaVPN.xcodeproj \
            -scheme AmneziaVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO \
            PATH="$PATH" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build-ios" -type d -name AmneziaVPN.app -path '*Release-iphoneos*' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Release app bundle not found"
            find "$GITHUB_WORKSPACE/build-ios" -type d -name '*.app' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa" Payload
          ls -lah "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-iOS-unsigned-ipa
          path: AmneziaVPN-iOS-unsigned.ipa
          retention-days: 7

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_REF="${{ inputs.ref }}"
          SAFE_REF=$(echo "$RAW_REF" | tr '/:@ ' '----')
          REL_TAG="unsigned-${SAFE_REF}"
          REL_TITLE="Amnezia unsigned IPA (${RAW_REF})"
          REL_NOTES="Source repo: ${{ inputs.source_repo }}
Source ref: ${RAW_REF}
Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if gh release view "$REL_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa" -R "${{ github.repository }}" --clobber
          else
            gh release create "$REL_TAG" "$GITHUB_WORKSPACE/AmneziaVPN-iOS-unsigned.ipa" -R "${{ github.repository }}" --title "$REL_TITLE" --notes "$REL_NOTES"
          fi
