name: Auto build upstream releases (unsigned IPA)

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API_URL="https://api.github.com/repos/amnezia-vpn/amnezia-client/releases/latest"
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read last built tag
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://api.github.com/repos/${{ github.repository }}/actions/variables/LAST_UPSTREAM_RELEASE_TAG"
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$URL" | jq -r '.value // empty')
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Decide if build is needed
        id: decide
        run: |
          if [ "${{ steps.upstream.outputs.tag }}" = "${{ steps.state.outputs.last }}" ]; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "No new release. Current: ${{ steps.upstream.outputs.tag }}"
          else
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "New release detected: ${{ steps.upstream.outputs.tag }} (previous: ${{ steps.state.outputs.last }})"
          fi

      - name: Trigger unsigned IPA workflow
        if: steps.decide.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-ipa-unsigned.yml/dispatches" \
            -d "{\"ref\":\"dev\",\"inputs\":{\"ref\":\"${{ steps.upstream.outputs.tag }}\",\"source_repo\":\"amnezia-vpn/amnezia-client\"}}"

      - name: Store last built release tag
        if: steps.decide.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://api.github.com/repos/${{ github.repository }}/actions/variables"
          PAYLOAD="{\"name\":\"LAST_UPSTREAM_RELEASE_TAG\",\"value\":\"${{ steps.upstream.outputs.tag }}\"}"

          CREATE_STATUS=$(curl -s -o /tmp/create_var_resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$BASE" \
            -d "$PAYLOAD")

          if [ "$CREATE_STATUS" = "201" ]; then
            echo "Variable created"
          else
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$BASE/LAST_UPSTREAM_RELEASE_TAG" \
              -d "$PAYLOAD"
            echo "Variable updated"
          fi

      - name: Print summary
        run: |
          echo "upstream_latest=${{ steps.upstream.outputs.tag }}"
          echo "last_built=${{ steps.state.outputs.last }}"
          echo "triggered=${{ steps.decide.outputs.trigger }}"
