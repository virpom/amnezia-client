name: Auto build upstream releases (unsigned IPA)

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API_URL="https://api.github.com/repos/amnezia-vpn/amnezia-client/releases/latest"
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check existing build runs for this release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-ipa-unsigned.yml/runs?per_page=50"
          COUNT=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$RUNS_URL" | jq -r --arg TAG "${{ steps.upstream.outputs.tag }}" '[.workflow_runs[] | select((.display_title // "" | contains("@ " + $TAG)) and (.status == "queued" or .status == "in_progress" or .conclusion == "success"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Decide if build is needed
        id: decide
        run: |
          if [ "${{ steps.existing.outputs.count }}" -gt 0 ]; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.upstream.outputs.tag }} already queued/in-progress/success"
          else
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "New release build required: ${{ steps.upstream.outputs.tag }}"
          fi

      - name: Trigger unsigned IPA workflow
        if: steps.decide.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-ipa-unsigned.yml/dispatches" \
            -d "{\"ref\":\"dev\",\"inputs\":{\"ref\":\"${{ steps.upstream.outputs.tag }}\",\"source_repo\":\"amnezia-vpn/amnezia-client\"}}"

      - name: Print summary
        run: |
          echo "upstream_latest=${{ steps.upstream.outputs.tag }}"
          echo "existing_runs=${{ steps.existing.outputs.count }}"
          echo "triggered=${{ steps.decide.outputs.trigger }}"
